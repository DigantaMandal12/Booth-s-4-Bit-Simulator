<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" role="img" aria-label="Booth's 4-Bit Simulator System Architecture">
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee"/>
    </marker>
    <style>
      .bg { fill: #0d1627; }
      .layer { fill: #111d33; stroke: #38bdf8; stroke-opacity: 0.35; stroke-width: 1.5; rx: 12; ry: 12; }
      .node { fill: #162542; stroke: #22d3ee; stroke-width: 1.5; rx: 8; ry: 8; }
      .node-teal { fill: #122a3a; stroke: #14b8a6; stroke-width: 1.8; rx: 8; ry: 8; }
      .title { fill: #f1f5f9; font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; }
      .layer-lbl { fill: #22d3ee; font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
      .txt { fill: #e2e8f0; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #94a3b8; font-family: 'Consolas', monospace; font-size: 11px; text-anchor: middle; }
      .edge { stroke: #22d3ee; stroke-width: 1.8; fill: none; marker-end: url(#arch-arrow); }
    </style>
  </defs>

  <rect class="bg" width="780" height="440" rx="12"/>
  <text x="390" y="30" class="title">Modular Client-Side Architecture (HTML5 + CSS3 + Vanilla JS)</text>

  <!-- Layer 1: Presentation Layer -->
  <rect class="layer" x="24" y="48" width="732" height="106"/>
  <text x="40" y="70" class="layer-lbl">Presentation Layer (HTML5 + Shared style.css)</text>

  <rect class="node" x="42" y="84" width="155" height="54"/>
  <text x="119" y="108" class="txt">index.html</text>
  <text x="119" y="125" class="sub">Home &amp; Overview</text>

  <rect class="node-teal" x="218" y="84" width="165" height="54"/>
  <text x="300" y="108" class="txt">simulator.html</text>
  <text x="300" y="125" class="sub">Interactive UI</text>

  <rect class="node" x="404" y="84" width="160" height="54"/>
  <text x="484" y="108" class="txt">algorithm.html</text>
  <text x="484" y="125" class="sub">Theory &amp; SVGs</text>

  <rect class="node" x="584" y="84" width="155" height="54"/>
  <text x="661" y="108" class="txt">about.html</text>
  <text x="661" y="125" class="sub">Academic Specs</text>

  <!-- Arrow from simulator.html to Logic Layer -->
  <line class="edge" x1="300" y1="138" x2="300" y2="178"/>

  <!-- Layer 2: Simulation Engine -->
  <rect class="layer" x="24" y="180" width="732" height="114"/>
  <text x="40" y="202" class="layer-lbl">Core Algorithm Engine (script.js)</text>

  <rect class="node" x="42" y="218" width="160" height="58"/>
  <text x="122" y="242" class="txt">Input Validator</text>
  <text x="122" y="259" class="sub">Integer [-8, +7]</text>

  <rect class="node" x="218" y="218" width="165" height="58"/>
  <text x="300" y="242" class="txt">2's Complement</text>
  <text x="300" y="259" class="sub">4-bit &amp; 5-bit Sign-Ext</text>

  <rect class="node-teal" x="399" y="218" width="165" height="58"/>
  <text x="481" y="242" class="txt">5-Bit Binary ALU</text>
  <text x="481" y="259" class="sub">Add / Sub (A ± M)</text>

  <rect class="node" x="580" y="218" width="160" height="58"/>
  <text x="660" y="242" class="txt">ARS Shifter</text>
  <text x="660" y="259" class="sub">10-bit [A, Q, Q-1]</text>

  <!-- Arrow to Register & Output Layer -->
  <line class="edge" x1="390" y1="294" x2="390" y2="322"/>

  <!-- Layer 3: Register State & Output -->
  <rect class="layer" x="24" y="324" width="732" height="94"/>
  <text x="40" y="346" class="layer-lbl">Register State &amp; Output Synthesis</text>

  <rect class="node" x="42" y="358" width="215" height="44"/>
  <text x="149" y="378" class="txt">Registers: A(5), Q(4), Q-1(1)</text>
  <text x="149" y="393" class="sub">Live Bit-Cell DOM Updates</text>

  <rect class="node" x="282" y="358" width="215" height="44"/>
  <text x="389" y="378" class="txt">4-Iteration Trace Table</text>
  <text x="389" y="393" class="sub">Step Forward / Back / Auto</text>

  <rect class="node-teal" x="522" y="358" width="215" height="44"/>
  <text x="629" y="378" class="txt">Final 8-Bit Product</text>
  <text x="629" y="393" class="sub">A[3:0] + Q[3:0] → Decimal</text>
</svg>
