<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 980" width="760" height="980" role="img" aria-label="Booth's 4-Bit Multiplication Flowchart">
  <defs>
    <marker id="fc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee"/>
    </marker>
    <style>
      .bg { fill: #0d1627; }
      .term { fill: #122a3a; stroke: #14b8a6; stroke-width: 2; }
      .io { fill: #162542; stroke: #38bdf8; stroke-width: 1.8; }
      .proc { fill: #162542; stroke: #22d3ee; stroke-width: 1.8; rx: 8; ry: 8; }
      .dec { fill: #1b2847; stroke: #f59e0b; stroke-width: 2; }
      .title { fill: #f1f5f9; font-family: 'Segoe UI', Arial, sans-serif; font-size: 17px; font-weight: 700; text-anchor: middle; }
      .txt { fill: #e2e8f0; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .sub { fill: #94a3b8; font-family: 'Consolas', monospace; font-size: 11px; text-anchor: middle; }
      .edge { stroke: #22d3ee; stroke-width: 1.8; fill: none; marker-end: url(#fc-arrow); }
      .lbl { fill: #fcd34d; font-family: 'Consolas', monospace; font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" width="760" height="980" rx="12"/>
  <text x="380" y="32" class="title">Booth's 4-Bit Multiplication — Algorithm Flowchart</text>

  <!-- Start (Oval) -->
  <rect class="term" x="290" y="50" width="180" height="42" rx="21" ry="21"/>
  <text x="380" y="76" class="txt">START</text>
  <line class="edge" x1="380" y1="92" x2="380" y2="118"/>

  <!-- Input M and Q (Parallelogram) -->
  <polygon class="io" points="250,120 530,120 510,168 230,168"/>
  <text x="380" y="142" class="txt">Input M and Q</text>
  <text x="380" y="158" class="sub">Validate M, Q in [-8, +7]</text>
  <line class="edge" x1="380" y1="168" x2="380" y2="194"/>

  <!-- Initialize Registers (Process) -->
  <rect class="proc" x="215" y="196" width="330" height="58"/>
  <text x="380" y="219" class="txt">Initialize Registers</text>
  <text x="380" y="236" class="sub">A = 00000, Q = 4-bit(Q), Q-1 = 0</text>
  <text x="380" y="249" class="sub">M = 5-bit sign-ext(M), Count = 4</text>
  <line class="edge" x1="380" y1="254" x2="380" y2="284"/>

  <!-- Decision: Check Q0 Q-1 (Diamond) -->
  <polygon class="dec" points="380,286 500,342 380,398 260,342"/>
  <text x="380" y="338" class="txt">Check Q0 Q-1</text>
  <text x="380" y="355" class="sub">Bit Pair Branch</text>

  <!-- Branch 10 (Left): A = A - M -->
  <polyline class="edge" points="260,342 125,342 125,428"/>
  <text x="165" y="334" class="lbl">10</text>
  <rect class="proc" x="40" y="430" width="170" height="48"/>
  <text x="125" y="452" class="txt">A = A - M</text>
  <text x="125" y="468" class="sub">(A + Two's Comp M)</text>

  <!-- Branch 00 / 11 (Center): No Operation -->
  <line class="edge" x1="380" y1="398" x2="380" y2="428"/>
  <text x="390" y="416" class="lbl">00 / 11</text>
  <rect class="proc" x="295" y="430" width="170" height="48"/>
  <text x="380" y="452" class="txt">No Operation</text>
  <text x="380" y="468" class="sub">Keep A Unchanged</text>

  <!-- Branch 01 (Right): A = A + M -->
  <polyline class="edge" points="500,342 635,342 635,428"/>
  <text x="565" y="334" class="lbl">01</text>
  <rect class="proc" x="550" y="430" width="170" height="48"/>
  <text x="635" y="452" class="txt">A = A + M</text>
  <text x="635" y="468" class="sub">(5-bit Binary Add)</text>

  <!-- Merge to Arithmetic Right Shift -->
  <polyline class="edge" points="125,478 125,508 380,508 380,532"/>
  <line class="edge" x1="380" y1="478" x2="380" y2="532"/>
  <polyline class="edge" points="635,478 635,508 380,508 380,532"/>

  <!-- Arithmetic Right Shift -->
  <rect class="proc" x="220" y="534" width="320" height="50"/>
  <text x="380" y="556" class="txt">Arithmetic Right Shift [A, Q, Q-1]</text>
  <text x="380" y="573" class="sub">Preserve A[0] Sign Bit</text>
  <line class="edge" x1="380" y1="584" x2="380" y2="610"/>

  <!-- Decrement Counter -->
  <rect class="proc" x="260" y="612" width="240" height="44"/>
  <text x="380" y="639" class="txt">Count = Count - 1</text>
  <line class="edge" x1="380" y1="656" x2="380" y2="682"/>

  <!-- Decision: 4 Iterations Complete? -->
  <polygon class="dec" points="380,684 505,736 380,788 255,736"/>
  <text x="380" y="732" class="txt">Count == 0?</text>
  <text x="380" y="749" class="sub">(4 Iterations Done?)</text>

  <!-- Loop Back (No) -->
  <polyline class="edge" points="255,736 22,736 22,272 380,272 380,284"/>
  <text x="130" y="728" class="lbl">No (Repeat)</text>

  <!-- Yes -> Generate Final Product -->
  <line class="edge" x1="380" y1="788" x2="380" y2="818"/>
  <text x="392" y="806" class="lbl">Yes</text>

  <rect class="proc" x="215" y="820" width="330" height="48"/>
  <text x="380" y="841" class="txt">Generate Final 8-Bit Product</text>
  <text x="380" y="857" class="sub">Product = A[3:0] (lower 4) + Q[3:0]</text>
  <line class="edge" x1="380" y1="868" x2="380" y2="892"/>

  <!-- Display Output (Parallelogram) -->
  <polygon class="io" points="240,894 540,894 520,934 220,934"/>
  <text x="380" y="918" class="txt">Display 8-Bit Binary &amp; Decimal Output</text>
  <line class="edge" x1="380" y1="934" x2="380" y2="946"/>

  <!-- End (Oval) -->
  <rect class="term" x="305" y="948" width="150" height="28" rx="14" ry="14"/>
  <text x="380" y="967" class="txt">END</text>
</svg>
